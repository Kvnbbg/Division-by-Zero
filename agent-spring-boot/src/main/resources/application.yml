spring:
  application:
    name: tdaah-agent
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true
info:
  app:
    author: Kevin Marville
    brand: Tech & Stream
    site: https://techandstream.com
tdaah:
  native:
    tools-dir: tools
    timeout-seconds: 15
  security:
    # Lab only. Set TDAAH_API_KEY in the environment; leave enabled=false for local open demo.
    enabled: false
    api-key: ${TDAAH_API_KEY:}
