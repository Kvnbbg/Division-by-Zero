name: Power Gate
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall web
      - run: test -f web/index.html
      - run: test -f NOTICE
      - run: test -f LICENSE
